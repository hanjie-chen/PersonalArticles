name: Notify Website Content Sync

# Every change to main reaches the website, which decides what counts as a note.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

# Back-to-back pushes need only the latest notification.
concurrency:
  group: notify-website-content-sync
  cancel-in-progress: true

jobs:
  notify-website:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website content sync workflow
        env:
          WEBSITE_TRIGGER_TOKEN: ${{ secrets.WEBSITE_WORKFLOW_TRIGGER_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${WEBSITE_TRIGGER_TOKEN}" \
            https://api.github.com/repos/hanjie-chen/website/actions/workflows/content-sync.yml/dispatches \
            -d @- <<EOF
          {
            "ref": "main",
            "inputs": {
              "source_repo": "${{ github.repository }}",
              "source_sha": "${{ github.sha }}",
              "source_before": "${{ github.event.before }}",
              "trigger_reason": "knowledge-base main updated"
            }
          }
          EOF
